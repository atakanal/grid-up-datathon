name: Submissionları doğrula

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  butunluk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dondurulmuş submission dosyalarını doğrula
        run: python scripts/submissionlari_dogrula.py
